<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takabi — Staff Portal</title><link rel="icon" href="assets/icon.png"><style>
:root{font-family:Inter,ui-rounded,system-ui,-apple-system,sans-serif;color:#49385c;background:#fdf9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse at 10% 18%,#efd6ff 0,transparent 49%),radial-gradient(ellipse at 90% 80%,#dcd4ff 0,transparent 49%),linear-gradient(120deg,#fff8ff,#f7f0ff 55%,#f5f7ff);display:flex;align-items:center;justify-content:center;padding:72px 18px;transition:background .3s,color .3s}body.dark{background:radial-gradient(ellipse at 10% 20%,#3e255e,transparent 54%),radial-gradient(ellipse at 90% 80%,#292047,transparent 55%),#151021;color:#f5edff}.toggle{position:fixed;right:24px;top:22px;border:1px solid #a985c34a;background:#ffffff9e;color:#7544a1;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;cursor:pointer;z-index:5;box-shadow:0 7px 24px #6b398018;transition:transform .2s,background .2s,border-color .2s}.toggle:hover{transform:translateY(-2px);background:#fff}.toggle svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}.dark .toggle{background:#372b4b;border-color:#6e5884;color:#e8d4ff}.dark .toggle:hover{background:#49365f}.sushi{position:fixed;top:-100px;left:var(--x);width:var(--size);height:var(--size);opacity:var(--opacity);animation:sushiFall var(--d) linear infinite;animation-delay:var(--delay);pointer-events:none;z-index:0;filter:drop-shadow(0 5px 5px #7a4b9b20);will-change:transform}.sushi svg{width:100%;height:100%}@keyframes sushiFall{0%{transform:translate3d(0,-70px,0) rotate(-22deg)}100%{transform:translate3d(var(--drift),calc(100vh + 200px),0) rotate(340deg)}}main{margin:auto;width:min(460px,100%);padding:30px 34px 27px;text-align:center;background:rgba(255,255,255,.9);border:1px solid #ffffffb5;border-radius:30px;box-shadow:0 25px 70px #513b7830;position:relative;z-index:1;backdrop-filter:blur(18px)}.dark main{background:rgba(37,29,53,.94);border-color:#56436b;box-shadow:0 25px 80px #0005}.logo{width:100%;height:180px;object-fit:contain;filter:drop-shadow(0 10px 10px #6b398033)}h1{font-size:29px;letter-spacing:-.7px;margin:4px 0 5px;color:#7a3eb5;font-weight:850}.dark h1{color:#d3a7ff}.subtitle{font-size:15px;color:#887b96;line-height:1.5;margin:0 0 25px}.dark .subtitle,.dark .small{color:#b9abc9}.login{width:100%;padding:16px 20px;border:1px solid #6f3ab1;border-bottom:3px solid #5c269b;border-radius:999px;background:linear-gradient(100deg,#9c5cde,#7134b6);color:white;font-size:16px;font-weight:750;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .2s,filter .2s}.login:hover{transform:translateY(-2px);filter:brightness(1.07)}.login svg{width:22px;height:22px}.small{font-size:12px;color:#91839e;line-height:1.5;margin:16px 0 8px}.links{font-size:12px;color:#9c57c4}.links a{color:inherit;text-decoration:none}.links a:hover{text-decoration:underline}.toast{display:none;margin:14px 0 0;padding:11px;border-radius:12px;background:#f3e8ff;color:#6c3c8b;font-size:13px}.toast.show{display:block}.dark .toast{background:#473159;color:#f1dbff}@media(prefers-reduced-motion:reduce){.sushi{animation:none;display:none}}@media(max-width:500px){main{padding:24px}.logo{height:150px}h1{font-size:26px}}
</style><style id="takabi-audio-style">.takabi-audio-button{display:grid;place-items:center;width:46px;height:46px;border:1px solid #a985c34a;border-radius:15px;background:#ffffffdd;color:#7544a1;cursor:pointer;box-shadow:0 7px 24px #6b398018;flex-shrink:0}.takabi-audio-button:hover{filter:brightness(.96)}.dark .takabi-audio-button{background:#372b4b;border-color:#6e5884;color:#e8d4ff}.takabi-audio-button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.takabi-audio-button.off{opacity:.7}body>.takabi-audio-button{position:fixed;right:80px;top:22px;z-index:8}</style></head><body><button class="toggle" id="theme" aria-label="Switch to dark mode" title="Toggle appearance"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M20.5 14.1A8.6 8.6 0 0 1 9.9 3.5 8.7 8.7 0 1 0 20.5 14.1Z"/><path d="M17 2v4M15 4h4M20 7v3M18.5 8.5h3"/></svg></button><div id="sushiRain" aria-hidden="true"></div><main><img class="logo" src="assets/takabi-logo.png" alt="Takabi logo"><h1>Staff Portal</h1><p class="subtitle">Applications, resources, and everything Takabi.<br>All in one place.</p><button class="login" id="login"><svg viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true"><path d="M104.4 8.7A102 102 0 0 0 79.3 1l-3.1 6.3a94 94 0 0 0-25.3 0L47.8 1a102 102 0 0 0-25.1 7.7C6.8 32.3 2.5 55.4 4.7 78.1a102 102 0 0 0 30.8 15.3l6.6-10.8a65 65 0 0 1-10.4-5l2.6-2a73 73 0 0 0 58.6 0l2.6 2a65 65 0 0 1-10.4 5l6.6 10.8a102 102 0 0 0 30.8-15.3c2.7-26.4-4.6-49.3-18.1-69.4ZM42.5 64.1c-5.6 0-10.2-5.1-10.2-11.4s4.5-11.4 10.2-11.4 10.3 5.1 10.2 11.4-4.5 11.4-10.2 11.4Zm42.1 0c-5.6 0-10.2-5.1-10.2-11.4s4.5-11.4 10.2-11.4 10.3 5.1 10.2 11.4-4.5 11.4-10.2 11.4Z"/></svg>Continue with Discord</button><p class="small">Sign in to access applications and staff resources.<br>Staff permissions are verified through Takabi's Discord server.</p><div class="toast" id="toast" role="status"></div></main><script>
const sushiArt = [
`<svg viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="44" rx="32" ry="26" fill="#263c38"/><ellipse cx="40" cy="39" rx="28" ry="23" fill="#f7f2e8"/><ellipse cx="40" cy="39" rx="17" ry="14" fill="#f49e91"/><rect x="33" y="28" width="13" height="22" rx="5" fill="#85b98b"/><circle cx="47" cy="35" r="5" fill="#f6d889"/></svg>`,
`<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="10" y="32" width="60" height="29" rx="14" fill="#f6f0e6"/><path d="M9 37Q14 18 39 19Q63 18 72 36Q68 43 60 43H20Q13 43 9 37" fill="#f49a9c"/><path d="M18 34Q40 25 62 34" stroke="#ffd4ce" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M37 23V55" stroke="#334b43" stroke-width="12" opacity=".9"/></svg>`,
`<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="11" y="25" width="58" height="39" rx="17" fill="#f5efe5"/><path d="M12 39Q22 15 47 18Q65 18 71 38Q61 48 44 45Q24 43 12 39" fill="#f3ad6d"/><path d="M17 35Q39 29 61 35M25 25Q45 23 59 30" stroke="#ffe0a6" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,
`<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="30" fill="#2c443b"/><circle cx="40" cy="40" r="24" fill="#f8f3e7"/><circle cx="40" cy="40" r="15" fill="#a5c98c"/><circle cx="40" cy="40" r="7" fill="#f8b0a1"/></svg>`
];
const rain=document.getElementById('sushiRain');for(let i=0;i<19;i++){const el=document.createElement('span');el.className='sushi';el.innerHTML=sushiArt[i%sushiArt.length];el.style.setProperty('--x',((i*37.7+11)%100)+'%');el.style.setProperty('--size',(30+(i*13%22))+'px');el.style.setProperty('--opacity',(0.33+(i%4)*0.10));el.style.setProperty('--d',(13+(i*7%13))+'s');el.style.setProperty('--delay',(-i*2.1)+'s');el.style.setProperty('--drift',((i%2?1:-1)*(30+i*7%100))+'px');rain.appendChild(el)}
const theme=document.getElementById('theme');const moon=`<path d="M20.5 14.1A8.6 8.6 0 0 1 9.9 3.5 8.7 8.7 0 1 0 20.5 14.1Z"/><path d="M17 2v4M15 4h4M20 7v3M18.5 8.5h3"/>`;const sun=`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`;theme.onclick=()=>{const dark=document.body.classList.toggle('dark');document.getElementById('themeIcon').innerHTML=dark?sun:moon;theme.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')};
function note(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show')}document.getElementById('login').onclick=()=>{window.location.href='/auth/discord'};
(async()=>{try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)return;const d=await r.json();if(d.authenticated){window.location.replace('/dashboard');}}catch(e){}})();
const query=new URLSearchParams(location.search);if(query.has('error')){note(({denied:'Discord sign-in was cancelled.',state:'Login expired. Please try again.',oauth:'Discord sign-in failed. Please try again.',config:'Discord login has not been configured on the server.'})[query.get('error')]||'Unable to sign in. Please try again.');history.replaceState(null,'',location.pathname)}document.getElementById('terms').onclick=e=>{e.preventDefault();note('Add your Terms of Service page before publishing.')};document.getElementById('privacy').onclick=e=>{e.preventDefault();note('Add your Privacy Policy page before publishing.')};
</script><script src="/assets/takabi-audio.js" defer></script></body></html>
